<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#20252a">

<meta name="description"
      content="Inventario digitale del Laboratorio di Fisica">

<link rel="manifest" href="manifest.json">

<title>Inventario Laboratorio di Fisica</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    color: #20252a;
}

/* ================================
   HEADER
================================ */

header {

    min-height: 70px;

    background: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 25px;

    box-shadow: 0 3px 15px rgba(0,0,0,.10);

    position: sticky;
    top: 0;

    z-index: 50;

}

.logo {

    font-size: 23px;
    font-weight: bold;

}

.logo span {

    font-size: 30px;

}

.header-buttons {

    display: flex;
    gap: 10px;

}

header button {

    border: none;
    background: #20252a;
    color: white;

    padding: 11px 16px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

}

/* ================================
   PAGINA
================================ */

main {

    max-width: 1200px;

    margin: auto;

    padding: 30px 20px 50px;

}

h1 {

    text-align: center;
    margin: 5px 0;

}

.subtitle {

    text-align: center;

    color: #69747b;

    margin-bottom: 25px;

}

/* ================================
   RICERCA
================================ */

.search-box {

    max-width: 700px;

    margin: 0 auto 30px;

    position: relative;

}

.search-box input {

    width: 100%;

    padding: 16px 20px;

    border: none;

    border-radius: 14px;

    background: white;

    box-shadow: 0 4px 15px rgba(0,0,0,.08);

    font-size: 16px;

    outline: none;

}

/* ================================
   ARMADI
================================ */

.cabinets {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;

}

/* ARMADIO */

.cabinet {

    background:
        linear-gradient(
            135deg,
            #b5bec2,
            #7f898e
        );

    border-radius: 14px;

    padding: 12px;

    height: 360px;

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.20);

    position: relative;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;

    touch-action: manipulation;

}

.cabinet:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 18px 30px
        rgba(0,0,0,.25);

}

/* INTERNO ARMADIO */

.cabinet-inner {

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #50595d,
            #8d979b,
            #50595d
        );

    border-radius: 8px;

    padding: 20px 15px;

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

}

/* RIPIANO */

.shelf {

    height: 90px;

    background:
        rgba(240,245,247,.85);

    border-bottom:
        8px solid #69747b;

    border-radius: 6px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    padding: 8px;

}

/* STRUMENTO */

.mini-tool {

    width: 58px;

    height: 65px;

    background: white;

    border-radius: 9px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 3px 7px rgba(0,0,0,.20);

}

.mini-tool img {

    width: 38px;
    height: 38px;

    object-fit: contain;

}

.mini-tool-name {

    font-size: 8px;

    text-align: center;

    max-width: 52px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.cabinet-label {

    position: absolute;

    bottom: 12px;

    left: 0;

    width: 100%;

    text-align: center;

    color: white;

    font-weight: bold;

    font-size: 15px;

}

/* MANIGLIA */

.cabinet-handle {

    position: absolute;

    right: 12px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 8px;

    height: 65px;

    background: #4b5357;

    border-radius: 8px;

}

/* ================================
   STATISTICHE
================================ */

.stats {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-bottom: 30px;

    flex-wrap: wrap;

}

.stat {

    background: white;

    border-radius: 14px;

    padding: 15px 25px;

    min-width: 150px;

    text-align: center;

    box-shadow:
        0 4px 12px rgba(0,0,0,.07);

}

.stat-number {

    font-size: 25px;

    font-weight: bold;

}

.stat-label {

    color: #69747b;

    font-size: 13px;

}

/* ================================
   PULSANTI
================================ */

.controls {

    margin-top: 30px;

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

}

.controls button {

    border: none;

    color: white;

    padding: 13px 20px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 15px;

}

.add {

    background: #218b57;

}

/* ================================
   MODALI
================================ */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.60);

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

}

.modal-box {

    background: white;

    width: 520px;

    max-width: 100%;

    max-height: 90vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 20px;

}

.modal-box h2 {

    margin-top: 0;

}

label {

    display: block;

    text-align: left;

    font-size: 14px;

    font-weight: bold;

    margin-top: 12px;

}

input,
select,
textarea {

    width: 100%;

    padding: 12px;

    margin-top: 6px;

    border:
        1px solid #ccd3d7;

    border-radius: 10px;

    font-size: 16px;

}

textarea {

    min-height: 80px;

    resize: vertical;

}

.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 20px;

}

.modal-buttons button {

    border: none;

    color: white;

    padding: 12px 18px;

    border-radius: 10px;

    cursor: pointer;

}

.cancel {

    background: #858e93;

}

.confirm {

    background: #218b57;

}

/* ================================
   INTERNO ARMADIO
================================ */

.cabinet-modal {

    width: 850px;

}

.cabinet-title {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 20px;

}

.cabinet-title h2 {

    margin: 0;

}

/* RIPIANI GRANDI */

.big-shelf {

    background:
        #dfe5e8;

    border-bottom:
        10px solid #9da7ab;

    border-radius: 10px;

    min-height: 150px;

    padding: 15px;

    margin-bottom: 15px;

}

.shelf-name {

    font-size: 12px;

    font-weight: bold;

    color: #69747b;

    margin-bottom: 10px;

}

/* PRODOTTI GRANDI */

.tools-grid {

    display: flex;

    flex-wrap: wrap;

    gap: 12px;

}

.tool-card {

    width: 125px;

    background: white;

    border-radius: 12px;

    padding: 10px;

    text-align: center;

    cursor: pointer;

    box-shadow:
        0 3px 8px rgba(0,0,0,.12);

    transition:
        transform .15s;

}

.tool-card:hover {

    transform:
        scale(1.04);

}

.tool-card img {

    width: 80px;
    height: 80px;

    object-fit: contain;

}

.tool-name {

    font-weight: bold;

    font-size: 13px;

}

.tool-quantity {

    font-size: 12px;

    color: #69747b;

    margin-top: 4px;

}

/* ================================
   DETTAGLIO STRUMENTO
================================ */

.tool-detail {

    text-align: center;

}

.tool-detail img {

    width: 180px;
    height: 180px;

    object-fit: contain;

}

.detail-row {

    background: #f1f4f5;

    padding: 12px;

    border-radius: 10px;

    margin-top: 8px;

    text-align: left;

}

/* ================================
   RESPONSIVE
================================ */

@media(max-width:900px) {

    .cabinets {

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:600px) {

    header {

        padding:
            10px 15px;

    }

    .logo {

        font-size: 17px;

    }

    .logo span {

        font-size: 24px;

    }

    header button {

        padding:
            10px 12px;

        font-size: 13px;

    }

    main {

        padding:
            20px 12px 40px;

    }

    h1 {

        font-size: 25px;

    }

    .subtitle {

        font-size: 14px;

    }

    .cabinets {

        grid-template-columns:
            1fr;

        gap: 18px;

    }

    .cabinet {

        height: 330px;

    }

    .stats {

        gap: 8px;

    }

    .stat {

        min-width: 100px;

        padding:
            12px 15px;

    }

    .stat-number {

        font-size: 21px;

    }

    .stat-label {

        font-size: 11px;

    }

    .modal {

        padding: 10px;

        align-items:
            flex-end;

    }

    .modal-box {

        width: 100%;

        max-height: 92vh;

        border-radius:
            20px 20px 10px 10px;

        padding: 20px;

    }

    .cabinet-modal {

        width: 100%;

    }

    .big-shelf {

        min-height: 130px;

    }

    .tool-card {

        width: 100px;

    }

    .tool-card img {

        width: 65px;
        height: 65px;

    }

    .tool-detail img {

        width: 150px;
        height: 150px;

    }

}

/* ================================
   SAFE AREA IPHONE
================================ */

@supports(padding: max(0px)) {

    header {

        padding-top:
            max(10px, env(safe-area-inset-top));

    }

    main {

        padding-bottom:
            max(40px, env(safe-area-inset-bottom));

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        <span>🔬</span>
        Laboratorio di Fisica

    </div>

    <div class="header-buttons">

        <button
            onclick="openAddModal()"
        >
            ➕ Aggiungi
        </button>

    </div>

</header>


<main>

    <h1>
        Inventario del laboratorio
    </h1>

    <div class="subtitle">

        Clicca su un armadio per vedere cosa contiene

    </div>


    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totalTools"
            >
                0
            </div>

            <div class="stat-label">
                Strumenti
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="totalCabinets"
            >
                6
            </div>

            <div class="stat-label">
                Armadi
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="totalTypes"
            >
                0
            </div>

            <div class="stat-label">
                Tipologie
            </div>

        </div>

    </div>


    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="🔎 Cerca uno strumento..."
            oninput="searchTools()"
        >

    </div>


    <div
        class="cabinets"
        id="cabinets"
    ></div>


    <div class="controls">

        <button
            class="add"
            onclick="openAddModal()"
        >

            ➕ Aggiungi strumento

        </button>

    </div>

</main>


<!-- MODALE AGGIUNTA -->

<div
    class="modal"
    id="addModal"
>

    <div class="modal-box">

        <h2>
            ➕ Aggiungi strumento
        </h2>


        <label>
            Nome strumento
        </label>

        <input
            id="toolName"
            type="text"
            placeholder="Es. Dinamometro"
        >


        <label>
            Categoria
        </label>

        <select id="toolCategory">

            <option value="meccanica">
                ⚙️ Meccanica
            </option>

            <option value="elettricita">
                ⚡ Elettricità
            </option>

            <option value="termologia">
                🌡️ Termologia
            </option>

            <option value="ottica">
                🔬 Ottica
            </option>

            <option value="misura">
                📏 Strumenti di misura
            </option>

            <option value="materiali">
                🧪 Materiali
            </option>

            <option value="altro">
                📦 Altro
            </option>

        </select>


        <label>
            Quantità
        </label>

        <input
            id="toolQuantity"
            type="number"
            min="1"
            value="1"
        >


        <label>
            Armadio
        </label>

        <select id="toolCabinet">

            <option value="1">
                Armadio 1 — Meccanica
            </option>

            <option value="2">
                Armadio 2 — Elettricità
            </option>

            <option value="3">
                Armadio 3 — Termologia
            </option>

            <option value="4">
                Armadio 4 — Ottica
            </option>

            <option value="5">
                Armadio 5 — Strumenti di misura
            </option>

            <option value="6">
                Armadio 6 — Materiali vari
            </option>

        </select>


        <label>
            Ripiano
        </label>

        <select id="toolShelf">

            <option value="1">
                Ripiano 1
            </option>

            <option value="2">
                Ripiano 2
            </option>

            <option value="3">
                Ripiano 3
            </option>

        </select>


        <label>
            Foto dello strumento
        </label>

        <input
            id="toolImage"
            type="file"
            accept="image/*"
            capture="environment"
        >


        <label>
            Note
        </label>

        <textarea
            id="toolNotes"
            placeholder="Es. 2 funzionanti, 1 da controllare..."
        ></textarea>


        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeAddModal()"
            >
                Annulla
            </button>

            <button
                class="confirm"
                onclick="addTool()"
            >
                Salva
            </button>

        </div>

    </div>

</div>


<!-- MODALE ARMADIO -->

<div
    class="modal"
    id="cabinetModal"
>

    <div
        class="modal-box cabinet-modal"
    >

        <div class="cabinet-title">

            <h2 id="cabinetModalTitle">
                Armadio
            </h2>

            <button
                onclick="closeCabinet()"
            >
                ✕
            </button>

        </div>


        <div id="cabinetContent"></div>

    </div>

</div>


<!-- MODALE DETTAGLIO -->

<div
    class="modal"
    id="detailModal"
>

    <div class="modal-box">

        <div
            class="tool-detail"
            id="toolDetail"
        ></div>

        <button
            class="cancel"
            style="
                width:100%;
                border:none;
                color:white;
                padding:12px;
                border-radius:10px;
                margin-top:15px;
                cursor:pointer;
            "
            onclick="closeDetail()"
        >

            Chiudi

        </button>

    </div>

</div>


<script>

/* ========================================
   REGISTRAZIONE PWA
======================================== */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(
                    function() {

                        console.log(
                            "Service Worker attivo."
                        );

                    }
                )
                .catch(
                    function(error) {

                        console.error(
                            "Errore Service Worker:",
                            error
                        );

                    }
                );

        }
    );

}


/* ========================================
   DATI
======================================== */

let tools =
    JSON.parse(
        localStorage.getItem(
            "physicsInventory"
        )
    ) || [];


/* ========================================
   ARMADI
======================================== */

const cabinets = [

    {
        id: 1,
        name: "Armadio 1",
        subtitle: "Meccanica"
    },

    {
        id: 2,
        name: "Armadio 2",
        subtitle: "Elettricità"
    },

    {
        id: 3,
        name: "Armadio 3",
        subtitle: "Termologia"
    },

    {
        id: 4,
        name: "Armadio 4",
        subtitle: "Ottica"
    },

    {
        id: 5,
        name: "Armadio 5",
        subtitle: "Strumenti di misura"
    },

    {
        id: 6,
        name: "Armadio 6",
        subtitle: "Materiali vari"
    }

];


/* ========================================
   SALVATAGGIO
======================================== */

function saveTools() {

    localStorage.setItem(
        "physicsInventory",
        JSON.stringify(tools)
    );

}


/* ========================================
   PLACEHOLDER
======================================== */

function defaultImage(name) {

    return `data:image/svg+xml;charset=UTF-8,
    ${encodeURIComponent(`
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="200"
            height="200"
        >

            <rect
                width="100%"
                height="100%"
                rx="20"
                fill="#eef2f4"
            />

            <text
                x="50%"
                y="45%"
                text-anchor="middle"
                font-size="60"
            >
                🔬
            </text>

            <text
                x="50%"
                y="75%"
                text-anchor="middle"
                font-size="15"
                font-family="Arial"
                fill="#59656b"
            >
                ${name}
            </text>

        </svg>
    `)}`;

}


/* ========================================
   APRI AGGIUNTA
======================================== */

function openAddModal() {

    document
        .getElementById("addModal")
        .style.display = "flex";

}


/* ========================================
   CHIUDI AGGIUNTA
======================================== */

function closeAddModal() {

    document
        .getElementById("addModal")
        .style.display = "none";

}


/* ========================================
   AGGIUNGI STRUMENTO
======================================== */

function addTool() {

    const name =
        document
        .getElementById("toolName")
        .value
        .trim();


    const category =
        document
        .getElementById("toolCategory")
        .value;


    const quantity =
        Number(
            document
            .getElementById("toolQuantity")
            .value
        );


    const cabinet =
        Number(
            document
            .getElementById("toolCabinet")
            .value
        );


    const shelf =
        Number(
            document
            .getElementById("toolShelf")
            .value
        );


    const notes =
        document
        .getElementById("toolNotes")
        .value
        .trim();


    if (!name) {

        alert(
            "Inserisci il nome dello strumento."
        );

        return;

    }


    if (
        !quantity ||
        quantity < 1
    ) {

        alert(
            "Inserisci una quantità valida."
        );

        return;

    }


    const file =
        document
        .getElementById("toolImage")
        .files[0];


    if (file) {

        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                saveNewTool(
                    name,
                    category,
                    quantity,
                    cabinet,
                    shelf,
                    notes,
                    event.target.result
                );

            };


        reader.readAsDataURL(file);

    }

    else {

        saveNewTool(
            name,
            category,
            quantity,
            cabinet,
            shelf,
            notes,
            defaultImage(name)
        );

    }

}


/* ========================================
   SALVA STRUMENTO
======================================== */

function saveNewTool(
    name,
    category,
    quantity,
    cabinet,
    shelf,
    notes,
    image
) {

    tools.push({

        id:
            Date.now() +
            Math.random(),

        name:
            name,

        category:
            category,

        quantity:
            quantity,

        cabinet:
            cabinet,

        shelf:
            shelf,

        notes:
            notes,

        image:
            image

    });


    saveTools();

    render();

    closeAddModal();

    clearForm();

}


/* ========================================
   PULIZIA FORM
======================================== */

function clearForm() {

    document
        .getElementById("toolName")
        .value = "";

    document
        .getElementById("toolQuantity")
        .value = 1;

    document
        .getElementById("toolNotes")
        .value = "";

    document
        .getElementById("toolImage")
        .value = "";

}


/* ========================================
   CREA ARMADI
======================================== */

function render() {

    const container =
        document
        .getElementById("cabinets");


    container.innerHTML = "";


    cabinets.forEach(
        cabinet => {

            const div =
                document.createElement("div");


            div.className =
                "cabinet";


            const cabinetTools =
                tools.filter(
                    tool =>
                        tool.cabinet ===
                        cabinet.id
                );


            let shelves = "";


            for (
                let shelf = 1;
                shelf <= 3;
                shelf++
            ) {

                const shelfTools =
                    cabinetTools
                    .filter(
                        tool =>
                            tool.shelf ===
                            shelf
                    )
                    .slice(0,4);


                shelves += `

                    <div class="shelf">

                        ${
                            shelfTools
                            .map(
                                tool => `

                                    <div
                                        class="mini-tool"
                                    >

                                        <img
                                            src="${tool.image}"
                                            alt="${tool.name}"
                                        >

                                        <div
                                            class="mini-tool-name"
                                        >
                                            ${tool.name}
                                        </div>

                                    </div>

                                `
                            )
                            .join("")
                        }

                    </div>

                `;

            }


            div.innerHTML = `

                <div
                    class="cabinet-inner"
                >

                    ${shelves}

                </div>

                <div
                    class="cabinet-handle"
                ></div>

                <div
                    class="cabinet-label"
                >

                    ${cabinet.name}
                    —
                    ${cabinet.subtitle}

                </div>

            `;


            div.onclick =
                function() {

                    openCabinet(
                        cabinet.id
                    );

                };


            container.appendChild(div);

        }
    );


    updateStats();

}


/* ========================================
   STATISTICHE
======================================== */

function updateStats() {

    const total =
        tools.reduce(
            (sum,tool) =>
                sum + tool.quantity,
            0
        );


    const types =
        new Set(
            tools.map(
                tool =>
                    tool.name.toLowerCase()
            )
        ).size;


    document
        .getElementById("totalTools")
        .textContent =
            total;


    document
        .getElementById("totalTypes")
        .textContent =
            types;

}


/* ========================================
   APRI ARMADIO
======================================== */

function openCabinet(id) {

    const cabinet =
        cabinets.find(
            item =>
                item.id === id
        );


    document
        .getElementById(
            "cabinetModalTitle"
        )
        .textContent =
            cabinet.name +
            " — " +
            cabinet.subtitle;


    const container =
        document
        .getElementById(
            "cabinetContent"
        );


    container.innerHTML = "";


    for (
        let shelf = 1;
        shelf <= 3;
        shelf++
    ) {

        const shelfTools =
            tools.filter(
                tool =>
                    tool.cabinet === id &&
                    tool.shelf === shelf
            );


        const shelfDiv =
            document.createElement(
                "div"
            );


        shelfDiv.className =
            "big-shelf";


        shelfDiv.innerHTML = `

            <div class="shelf-name">

                RIPIANO ${shelf}

            </div>

            <div
                class="tools-grid"
            ></div>

        `;


        const grid =
            shelfDiv.querySelector(
                ".tools-grid"
            );


        if (
            shelfTools.length === 0
        ) {

            grid.innerHTML =
                "<span style='color:#69747b'>Ripiano vuoto</span>";

        }


        shelfTools.forEach(
            tool => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "tool-card";


                card.innerHTML = `

                    <img
                        src="${tool.image}"
                        alt="${tool.name}"
                    >

                    <div
                        class="tool-name"
                    >
                        ${tool.name}
                    </div>

                    <div
                        class="tool-quantity"
                    >
                        Quantità: ${tool.quantity}
                    </div>

                `;


                card.onclick =
                    function(event) {

                        event.stopPropagation();

                        openToolDetail(
                            tool.id
                        );

                    };


                grid.appendChild(card);

            }
        );


        container.appendChild(
            shelfDiv
        );

    }


    document
        .getElementById(
            "cabinetModal"
        )
        .style.display =
            "flex";

}


/* ========================================
   CHIUDI ARMADIO
======================================== */

function closeCabinet() {

    document
        .getElementById(
            "cabinetModal"
        )
        .style.display =
            "none";

}


/* ========================================
   DETTAGLIO
======================================== */

function openToolDetail(id) {

    const tool =
        tools.find(
            item =>
                item.id === id
        );


    if (!tool) return;


    const cabinet =
        cabinets.find(
            item =>
                item.id === tool.cabinet
        );


    document
        .getElementById(
            "toolDetail"
        )
        .innerHTML = `

            <h2>
                ${tool.name}
            </h2>

            <img
                src="${tool.image}"
                alt="${tool.name}"
            >

            <div
                class="detail-row"
            >
                <strong>
                    Quantità
                </strong>

                <br>

                ${tool.quantity}
            </div>

            <div
                class="detail-row"
            >
                <strong>
                    Categoria
                </strong>

                <br>

                ${tool.category}
            </div>

            <div
                class="detail-row"
            >
                <strong>
                    Posizione
                </strong>

                <br>

                ${cabinet.name}
                →
                Ripiano ${tool.shelf}
            </div>

            <div
                class="detail-row"
            >
                <strong>
                    Note
                </strong>

                <br>

                ${
                    tool.notes ||
                    "Nessuna nota."
                }

            </div>

            <div
                style="
                    display:flex;
                    gap:10px;
                    margin-top:15px;
                "
            >

                <button
                    onclick="deleteTool(${tool.id})"
                    style="
                        flex:1;
                        border:none;
                        background:#d62828;
                        color:white;
                        padding:12px;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    🗑️ Elimina
                </button>

            </div>

        `;


    document
        .getElementById(
            "detailModal"
        )
        .style.display =
            "flex";

}


/* ========================================
   CHIUDI DETTAGLIO
======================================== */

function closeDetail() {

    document
        .getElementById(
            "detailModal"
        )
        .style.display =
            "none";

}


/* ========================================
   ELIMINA
======================================== */

function deleteTool(id) {

    const tool =
        tools.find(
            item =>
                item.id === id
        );


    if (!tool) return;


    const confirmDelete =
        confirm(
            "Eliminare " +
            tool.name +
            " dall'inventario?"
        );


    if (!confirmDelete) return;


    tools =
        tools.filter(
            item =>
                item.id !== id
        );


    saveTools();

    closeDetail();

    render();

}


/* ========================================
   RICERCA
======================================== */

function searchTools() {

    const query =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    if (!query) {

        render();

        return;

    }


    const results =
        tools.filter(
            tool =>
                tool.name
                .toLowerCase()
                .includes(query)
        );


    const container =
        document
        .getElementById(
            "cabinets"
        );


    container.innerHTML = "";


    results.forEach(
        tool => {

            const cabinet =
                cabinets.find(
                    item =>
                        item.id ===
                        tool.cabinet
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cabinet";


            div.innerHTML = `

                <div
                    class="cabinet-inner"
                >

                    <div
                        class="shelf"
                    >

                        <div
                            class="tool-card"
                        >

                            <img
                                src="${tool.image}"
                                alt="${tool.name}"
                            >

                            <div
                                class="tool-name"
                            >
                                ${tool.name}
                            </div>

                            <div
                                class="tool-quantity"
                            >
                                x${tool.quantity}
                            </div>

                        </div>

                    </div>

                </div>

                <div
                    class="cabinet-label"
                >

                    📍
                    ${cabinet.name}
                    →
                    Ripiano ${tool.shelf}

                </div>

            `;


            div.onclick =
                function() {

                    openToolDetail(
                        tool.id
                    );

                };


            container.appendChild(
                div
            );

        }
    );

}


/* ========================================
   AVVIO
======================================== */

render();

</script>

</body>
